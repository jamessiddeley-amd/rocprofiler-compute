Panel Config:
  id: 400
  title: Roofline Information - GFX941 (MI300X A0)

  data source:
    - roofline_config:
        supported_datatypes:
          - "FP8"
          - "FP16"
          - "BF16"
          - "FP32"
          - "FP64"
          - "I8"
          - "I32"
          - "I64"

        performance_counters:
          - SQ_INSTS_VALU_ADD_F16
          - SQ_INSTS_VALU_MUL_F16
          - SQ_INSTS_VALU_FMA_F16
          - SQ_INSTS_VALU_TRANS_F16
          - SQ_INSTS_VALU_ADD_F32
          - SQ_INSTS_VALU_MUL_F32
          - SQ_INSTS_VALU_FMA_F32
          - SQ_INSTS_VALU_TRANS_F32
          - SQ_INSTS_VALU_ADD_F64
          - SQ_INSTS_VALU_MUL_F64
          - SQ_INSTS_VALU_FMA_F64
          - SQ_INSTS_VALU_TRANS_F64
          - SQ_INSTS_VALU_MFMA_MOPS_F16
          - SQ_INSTS_VALU_MFMA_MOPS_BF16
          - SQ_INSTS_VALU_MFMA_MOPS_F32
          - SQ_INSTS_VALU_MFMA_MOPS_F64
          - SQ_INSTS_VALU_MFMA_MOPS_I8
          - SQ_INSTS_VALU_MFMA_MOPS_F8
          - SQ_LDS_IDX_ACTIVE
          - SQ_LDS_BANK_CONFLICT
          - TCP_TOTAL_CACHE_ACCESSES_sum
          - TCP_TCC_WRITE_REQ_sum
          - TCP_TCC_ATOMIC_WITH_RET_REQ_sum
          - TCP_TCC_ATOMIC_WITHOUT_RET_REQ_sum
          - TCP_TCC_READ_REQ_sum
          - TCC_EA0_RDREQ_32B_sum
          - TCC_EA0_RDREQ_sum
          - TCC_EA0_WRREQ_64B_sum
          - TCC_EA0_WRREQ_sum
          - End_Timestamp
          - Start_Timestamp
          - Kernel_Name

        calc_ai_constants:
          wave_size: 64
          mfma_multiplier_default: 512
          lds_transaction_bytes: 4
          cache_line_bytes: 64
          hbm_rd_32b_transaction_bytes: 32
          hbm_rd_other_transaction_bytes: 64
          hbm_wr_non_64b_transaction_bytes: 32
          hbm_wr_64b_transaction_bytes: 64

        arithmetic_intensity_equations:
          total_flops_base: |
            (($c.wave_size * (SQ_INSTS_VALU_ADD_F16 + 
                              SQ_INSTS_VALU_MUL_F16 + 
                              (2 * SQ_INSTS_VALU_FMA_F16) + 
                              SQ_INSTS_VALU_TRANS_F16)) + 
             ($c.wave_size * (SQ_INSTS_VALU_ADD_F32 + 
                              SQ_INSTS_VALU_MUL_F32 + 
                              (2 * SQ_INSTS_VALU_FMA_F32) + 
                              SQ_INSTS_VALU_TRANS_F32)) + 
             ($c.wave_size * (SQ_INSTS_VALU_ADD_F64 + 
                              SQ_INSTS_VALU_MUL_F64 + 
                              (2 * SQ_INSTS_VALU_FMA_F64) + 
                              SQ_INSTS_VALU_TRANS_F64)) + 
             (SQ_INSTS_VALU_MFMA_MOPS_F16 * $c.mfma_multiplier_default) + 
             (SQ_INSTS_VALU_MFMA_MOPS_BF16 * $c.mfma_multiplier_default) + 
             (SQ_INSTS_VALU_MFMA_MOPS_F32 * $c.mfma_multiplier_default) + 
             (SQ_INSTS_VALU_MFMA_MOPS_F64 * $c.mfma_multiplier_default))

          total_flops_fp8_addition: |
            (SQ_INSTS_VALU_MFMA_MOPS_F8 * $c.mfma_multiplier_default)

          valu_flops: |
            (($c.wave_size * (SQ_INSTS_VALU_ADD_F16 + 
                              SQ_INSTS_VALU_MUL_F16 + 
                              (2 * SQ_INSTS_VALU_FMA_F16) + 
                              SQ_INSTS_VALU_TRANS_F16)) + 
             ($c.wave_size * (SQ_INSTS_VALU_ADD_F32 + 
                              SQ_INSTS_VALU_MUL_F32 + 
                              (2 * SQ_INSTS_VALU_FMA_F32) + 
                              SQ_INSTS_VALU_TRANS_F32)) + 
             ($c.wave_size * (SQ_INSTS_VALU_ADD_F64 + 
                              SQ_INSTS_VALU_MUL_F64 + 
                              (2 * SQ_INSTS_VALU_FMA_F64) + 
                              SQ_INSTS_VALU_TRANS_F64)))

          mfma_flops_f16: |
            (SQ_INSTS_VALU_MFMA_MOPS_F16 * $c.mfma_multiplier_default)

          mfma_flops_bf16: |
            (SQ_INSTS_VALU_MFMA_MOPS_BF16 * $c.mfma_multiplier_default)

          mfma_flops_f32: |
            (SQ_INSTS_VALU_MFMA_MOPS_F32 * $c.mfma_multiplier_default)

          mfma_flops_f64: |
            (SQ_INSTS_VALU_MFMA_MOPS_F64 * $c.mfma_multiplier_default)

          mfma_iops_i8: |
            (SQ_INSTS_VALU_MFMA_MOPS_I8 * $c.mfma_multiplier_default)

          mfma_flops_f8: |
            (SQ_INSTS_VALU_MFMA_MOPS_F8 * $c.mfma_multiplier_default)

          lds_data: |
            ((SQ_LDS_IDX_ACTIVE - SQ_LDS_BANK_CONFLICT) * 
             $c.lds_transaction_bytes * 
             $m.lds_banks_per_cu)

          L1cache_data: |
            (TCP_TOTAL_CACHE_ACCESSES_sum * $c.cache_line_bytes)

          L2cache_data: |
            (((TCP_TCC_WRITE_REQ_sum + 
               TCP_TCC_ATOMIC_WITH_RET_REQ_sum + 
               TCP_TCC_ATOMIC_WITHOUT_RET_REQ_sum + 
               TCP_TCC_READ_REQ_sum)) * 
             $c.cache_line_bytes)

          hbm_data: |
            ((TCC_EA0_RDREQ_32B_sum * $c.hbm_rd_32b_transaction_bytes) + 
             ((TCC_EA0_RDREQ_sum - TCC_EA0_RDREQ_32B_sum) * 
              $c.hbm_rd_other_transaction_bytes) + 
             ((TCC_EA0_WRREQ_sum - TCC_EA0_WRREQ_64B_sum) * 
              $c.hbm_wr_non_64b_transaction_bytes) + 
             (TCC_EA0_WRREQ_64B_sum * $c.hbm_wr_64b_transaction_bytes))