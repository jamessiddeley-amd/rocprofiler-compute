Panel Config:
  id: 400
  title: GFX942 Roofline Analysis
  data source:
    - metric_table:
        id: 401
        title: Roofline Performance Rates
        header:
          metric: Metric
          value: Value
          unit: Unit
          peak: Peak (Empirical Max)
        metric:
          # ==================================================================
          # GROUP 1: PERFORMANCE RATES (PER SECOND)
          # ==================================================================

          # --- Compute Rates ---
          VALU FLOPs:
            value: >-
              ((($wave_size * (
              (SQ_INSTS_VALU_ADD_F16 + SQ_INSTS_VALU_MUL_F16 + (2 * SQ_INSTS_VALU_FMA_F16) + SQ_INSTS_VALU_TRANS_F16) +
              (SQ_INSTS_VALU_ADD_F32 + SQ_INSTS_VALU_MUL_F32 + (2 * SQ_INSTS_VALU_FMA_F32) + SQ_INSTS_VALU_TRANS_F32) +
              (SQ_INSTS_VALU_ADD_F64 + SQ_INSTS_VALU_MUL_F64 + (2 * SQ_INSTS_VALU_FMA_F64) + SQ_INSTS_VALU_TRANS_F64)
              )) / (End_Timestamp - Start_Timestamp)))
            unit: GFLOP/s
            peak: $VALU_FLOPs_empirical_peak
          MFMA FLOPs (F64):
            value: >-
              (((SQ_INSTS_VALU_MFMA_MOPS_F64 * $mfma_multiplier_default)) / (End_Timestamp - Start_Timestamp))
            unit: GFLOP/s
            peak: $MFMA_FLOPs_F64_empirical_peak
          MFMA FLOPs (F32):
            value: >-
              (((SQ_INSTS_VALU_MFMA_MOPS_F32 * $mfma_multiplier_default)) / (End_Timestamp - Start_Timestamp))
            unit: GFLOP/s
            peak: $MFMA_FLOPs_F32_empirical_peak
          MFMA FLOPs (F16):
            value: >-
              (((SQ_INSTS_VALU_MFMA_MOPS_F16 * $mfma_multiplier_default)) / (End_Timestamp - Start_Timestamp))
            unit: GFLOP/s
            peak: $MFMA_FLOPs_F16_empirical_peak
          MFMA FLOPs (BF16):
            value: >-
              (((SQ_INSTS_VALU_MFMA_MOPS_BF16 * $mfma_multiplier_default)) / (End_Timestamp - Start_Timestamp))
            unit: GFLOP/s
            peak: $MFMA_FLOPs_BF16_empirical_peak
          MFMA FLOPs (F8):
            value: >-
              (((SQ_INSTS_VALU_MFMA_MOPS_F8 * $mfma_multiplier_default)) / (End_Timestamp - Start_Timestamp))
            unit: GFLOP/s
            peak: $MFMA_FLOPs_F8_empirical_peak
          MFMA IOPs (Int8):
            value: >-
              (((SQ_INSTS_VALU_MFMA_MOPS_I8 * $mfma_multiplier_default)) / (End_Timestamp - Start_Timestamp))
            unit: GIOP/s
            peak: $MFMA_IOPs_Int8_empirical_peak

          # --- Bandwidth Rates ---
          HBM Bandwidth:
            value: >-
              ((((TCC_BUBBLE_sum * $hbm_bubble_transaction_bytes) +
              (TCC_EA0_RDREQ_32B_sum * $hbm_ea_rd_32b_transaction_bytes) +
              ((TCC_EA0_RDREQ_sum - TCC_BUBBLE_sum - TCC_EA0_RDREQ_32B_sum) * $hbm_ea_rd_other_transaction_bytes) +
              ((TCC_EA0_WRREQ_sum - TCC_EA0_WRREQ_64B_sum) * $hbm_ea_wr_non_64b_transaction_bytes) +
              (TCC_EA0_WRREQ_64B_sum * $hbm_ea_wr_64b_transaction_bytes))) / (End_Timestamp - Start_Timestamp))
            unit: GB/s
            peak: $HBM_Bandwidth_empirical_peak
          L2 Cache Bandwidth:
            value: >-
              ((((TCP_TCC_WRITE_REQ_sum + TCP_TCC_ATOMIC_WITH_RET_REQ_sum +
              TCP_TCC_ATOMIC_WITHOUT_RET_REQ_sum + TCP_TCC_READ_REQ_sum) *
              $cache_line_bytes)) / (End_Timestamp - Start_Timestamp))
            unit: GB/s
            peak: $L2_Cache_Bandwidth_empirical_peak
          L1 Cache Bandwidth:
            value: >-
              (((TCP_TOTAL_CACHE_ACCESSES_sum * $cache_line_bytes)) / (End_Timestamp - Start_Timestamp))
            unit: GB/s
            peak: $L1_Cache_Bandwidth_empirical_peak
          LDS Bandwidth:
            value: >-
              ((((SQ_LDS_IDX_ACTIVE - SQ_LDS_BANK_CONFLICT) *
              $lds_transaction_bytes * $lds_banks_per_cu)) / (End_Timestamp - Start_Timestamp))
            unit: GB/s
            peak: $LDS_Bandwidth_empirical_peak
    - metric_table:
        id: 402
        title: Roofline Calculation Data
        header:
          metric: Metric
          value: Value
          unit: Unit
        metric:
          # ==================================================================
          # GROUP 2: TOTAL OPERATIONS & DATA (RAW COUNTS)
          # ==================================================================
          Total_FLOPs:
            value: >-
              (($wave_size * (
              (SQ_INSTS_VALU_ADD_F16 + SQ_INSTS_VALU_MUL_F16 + (2 * SQ_INSTS_VALU_FMA_F16) + SQ_INSTS_VALU_TRANS_F16) +
              (SQ_INSTS_VALU_ADD_F32 + SQ_INSTS_VALU_MUL_F32 + (2 * SQ_INSTS_VALU_FMA_F32) + SQ_INSTS_VALU_TRANS_F32) +
              (SQ_INSTS_VALU_ADD_F64 + SQ_INSTS_VALU_MUL_F64 + (2 * SQ_INSTS_VALU_FMA_F64) + SQ_INSTS_VALU_TRANS_F64)
              )) +
              (SQ_INSTS_VALU_MFMA_MOPS_F16 * $mfma_multiplier_default) +
              (SQ_INSTS_VALU_MFMA_MOPS_BF16 * $mfma_multiplier_default) +
              (SQ_INSTS_VALU_MFMA_MOPS_F32 * $mfma_multiplier_default) +
              (SQ_INSTS_VALU_MFMA_MOPS_F64 * $mfma_multiplier_default) +
              (SQ_INSTS_VALU_MFMA_MOPS_F8 * $mfma_multiplier_default))
            unit: GFLOPs
          Total VALU FLOPs:
            value: >-
              ($wave_size * (
              (SQ_INSTS_VALU_ADD_F16 + SQ_INSTS_VALU_MUL_F16 + (2 * SQ_INSTS_VALU_FMA_F16) + SQ_INSTS_VALU_TRANS_F16) +
              (SQ_INSTS_VALU_ADD_F32 + SQ_INSTS_VALU_MUL_F32 + (2 * SQ_INSTS_VALU_FMA_F32) + SQ_INSTS_VALU_TRANS_F32) +
              (SQ_INSTS_VALU_ADD_F64 + SQ_INSTS_VALU_MUL_F64 + (2 * SQ_INSTS_VALU_FMA_F64) + SQ_INSTS_VALU_TRANS_F64)
              ))
            unit: GFLOPs
          Total_HBM_Data:
            value: >-
              ((TCC_BUBBLE_sum * $hbm_bubble_transaction_bytes) +
              (TCC_EA0_RDREQ_32B_sum * $hbm_ea_rd_32b_transaction_bytes) +
              ((TCC_EA0_RDREQ_sum - TCC_BUBBLE_sum - TCC_EA0_RDREQ_32B_sum) * $hbm_ea_rd_other_transaction_bytes) +
              ((TCC_EA0_WRREQ_sum - TCC_EA0_WRREQ_64B_sum) * $hbm_ea_wr_non_64b_transaction_bytes) +
              (TCC_EA0_WRREQ_64B_sum * $hbm_ea_wr_64b_transaction_bytes))
            unit: Bytes
          Total L2 Cache Data:
            value: >-
              ((TCP_TCC_WRITE_REQ_sum + TCP_TCC_ATOMIC_WITH_RET_REQ_sum +
              TCP_TCC_ATOMIC_WITHOUT_RET_REQ_sum + TCP_TCC_READ_REQ_sum) *
              $cache_line_bytes)
            unit: Bytes
          Total L1 Cache Data:
            value: '(TCP_TOTAL_CACHE_ACCESSES_sum * $cache_line_bytes)'
            unit: Bytes
          Total LDS Data:
            value: >-
              ((SQ_LDS_IDX_ACTIVE - SQ_LDS_BANK_CONFLICT) *
              $lds_transaction_bytes * $lds_banks_per_cu)
            unit: Bytes

          # Final Calculated Metrics
          AI_HBM:
            value: |
              (
                (
                  ($wave_size * (
                    (SQ_INSTS_VALU_ADD_F16 + SQ_INSTS_VALU_MUL_F16 + (2 * SQ_INSTS_VALU_FMA_F16) + SQ_INSTS_VALU_TRANS_F16) +
                    (SQ_INSTS_VALU_ADD_F32 + SQ_INSTS_VALU_MUL_F32 + (2 * SQ_INSTS_VALU_FMA_F32) + SQ_INSTS_VALU_TRANS_F32) +
                    (SQ_INSTS_VALU_ADD_F64 + SQ_INSTS_VALU_MUL_F64 + (2 * SQ_INSTS_VALU_FMA_F64) + SQ_INSTS_VALU_TRANS_F64)
                  )) +
                  (SQ_INSTS_VALU_MFMA_MOPS_F16 * $mfma_multiplier_default) +
                  (SQ_INSTS_VALU_MFMA_MOPS_BF16 * $mfma_multiplier_default) +
                  (SQ_INSTS_VALU_MFMA_MOPS_F32 * $mfma_multiplier_default) +
                  (SQ_INSTS_VALU_MFMA_MOPS_F64 * $mfma_multiplier_default) +
                  (SQ_INSTS_VALU_MFMA_MOPS_F8 * $mfma_multiplier_default)
                ) /
                (
                  (
                    (TCC_BUBBLE_sum * $hbm_bubble_transaction_bytes) +
                    (TCC_EA0_RDREQ_32B_sum * $hbm_ea_rd_32b_transaction_bytes) +
                    ((TCC_EA0_RDREQ_sum - TCC_BUBBLE_sum - TCC_EA0_RDREQ_32B_sum) * $hbm_ea_rd_other_transaction_bytes) +
                    ((TCC_EA0_WRREQ_sum - TCC_EA0_WRREQ_64B_sum) * $hbm_ea_wr_non_64b_transaction_bytes) +
                    (TCC_EA0_WRREQ_64B_sum * $hbm_ea_wr_64b_transaction_bytes)
                  ) if (
                    (TCC_BUBBLE_sum * $hbm_bubble_transaction_bytes) +
                    (TCC_EA0_RDREQ_32B_sum * $hbm_ea_rd_32b_transaction_bytes) +
                    ((TCC_EA0_RDREQ_sum - TCC_BUBBLE_sum - TCC_EA0_RDREQ_32B_sum) * $hbm_ea_rd_other_transaction_bytes) +
                    ((TCC_EA0_WRREQ_sum - TCC_EA0_WRREQ_64B_sum) * $hbm_ea_wr_non_64b_transaction_bytes) +
                    (TCC_EA0_WRREQ_64B_sum * $hbm_ea_wr_64b_transaction_bytes)
                  ) > 0 else 1
                )
              )
            unit: FLOPs/Byte

          Performance_GFLOPs:
            value: |
              (
                (
                  ($wave_size * (
                    (SQ_INSTS_VALU_ADD_F16 + SQ_INSTS_VALU_MUL_F16 + (2 * SQ_INSTS_VALU_FMA_F16) + SQ_INSTS_VALU_TRANS_F16) +
                    (SQ_INSTS_VALU_ADD_F32 + SQ_INSTS_VALU_MUL_F32 + (2 * SQ_INSTS_VALU_FMA_F32) + SQ_INSTS_VALU_TRANS_F32) +
                    (SQ_INSTS_VALU_ADD_F64 + SQ_INSTS_VALU_MUL_F64 + (2 * SQ_INSTS_VALU_FMA_F64) + SQ_INSTS_VALU_TRANS_F64)
                  )) +
                  (SQ_INSTS_VALU_MFMA_MOPS_F16 * $mfma_multiplier_default) +
                  (SQ_INSTS_VALU_MFMA_MOPS_BF16 * $mfma_multiplier_default) +
                  (SQ_INSTS_VALU_MFMA_MOPS_F32 * $mfma_multiplier_default) +
                  (SQ_INSTS_VALU_MFMA_MOPS_F64 * $mfma_multiplier_default) +
                  (SQ_INSTS_VALU_MFMA_MOPS_F8 * $mfma_multiplier_default)
                ) /
                ((End_Timestamp - Start_Timestamp) / 1e9)
              ) / 1e9
            unit: GFLOP/s






